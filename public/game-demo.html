                e.preventDefault();
                if (gameState === 'START') startGame();
                else if (gameState === 'GAME_OVER' || gameState === 'WIN') resetGame();
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        // ===== AUDIO =====
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                const now = audioContext.currentTime;
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);
                gain.gain.setValueAtTime(0.08, now);
                switch(type) {
                    case 'jump':
                        osc.frequency.setValueAtTime(400, now);
                        osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                        osc.start(now); osc.stop(now + 0.1); break;
                    case 'collect':
                        osc.frequency.setValueAtTime(800, now);
                        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2); break;
                    case 'stomp':
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.exponentialRampToValueAtTime(200, now + 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                        osc.start(now); osc.stop(now + 0.15); break;
                    case 'hurt':
                        osc.frequency.setValueAtTime(200, now);
                        osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                        osc.start(now); osc.stop(now + 0.3); break;
                    case 'win':
                        osc.frequency.setValueAtTime(523, now);
                        osc.frequency.setValueAtTime(659, now + 0.15);
                        osc.frequency.setValueAtTime(784, now + 0.3);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                        osc.start(now); osc.stop(now + 0.5); break;
                }
            } catch(e) {}
        }

        // ===== HELPER: Rectangle intersection =====
        function makeRect(x, y, w, h) {
            return {
                left: x, right: x + w, top: y, bottom: y + h,
                intersect(other) {
                    return this.left < other.right && this.right > other.left &&
                           this.top < other.bottom && this.bottom > other.top;
                }
            };
        }

        // ===== PLAYER =====
        class Player {
            constructor() {
                this.x = 100; this.y = 0;
                this.vx = 0; this.vy = 0;
                this.width = PLAYER_WIDTH; this.height = PLAYER_HEIGHT;
                this.onGround = false; this.direction = 1;
                this.jumpRotation = 0; this.isJumping = false;
                this.runFrame = 0;
            }

            update() {
                let moveInput = 0;
                if (keys['arrowleft'] || keys['a']) { moveInput = -1; this.direction = -1; }
                if (keys['arrowright'] || keys['d']) { moveInput = 1; this.direction = 1; }

                this.vx += moveInput * ACCELERATION;
                this.vx *= FRICTION;
                this.vx = Math.max(-MAX_SPEED, Math.min(MAX_SPEED, this.vx));
                this.vy += GRAVITY;

                if ((keys[' ']) && this.onGround) {
                    this.vy = -JUMP_STRENGTH;
                    this.onGround = false;
                    this.isJumping = true;
                    playSound('jump');
                }

                if (this.isJumping) {
                    this.jumpRotation += Math.PI * 2 / 25;
                    if (this.jumpRotation >= Math.PI * 2) this.jumpRotation = 0;
                } else {
                    this.jumpRotation = 0;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0) this.x = 0;
                if (this.x + this.width > LEVEL_WIDTH) this.x = LEVEL_WIDTH - this.width;

                if (this.y > canvas.height + 100) this.loseLife();

                if (Math.abs(this.vx) > 0.5) this.runFrame += Math.abs(this.vx) * 0.08;
                else this.runFrame = 0;

                this.onGround = false;
            }

            collideWith(obj) {
                const pr = this.getRect();
                const or2 = obj.getRect();
                if (!pr.intersect(or2)) return null;

                const oL = pr.right - or2.left;
                const oR = or2.right - pr.left;
                const oT = pr.bottom - or2.top;
                const oB = or2.bottom - pr.top;
                const min = Math.min(oL, oR, oT, oB);

                if (min === oT && this.vy >= 0) {
                    this.y = or2.top - this.height;
                    this.vy = 0; this.onGround = true; this.isJumping = false;
                    return 'top';
                } else if (min === oB && this.vy < 0) {
                    this.y = or2.bottom; this.vy = 1;
                    return 'bottom';
                } else if (min === oL && this.vx > 0) {
                    this.x = or2.left - this.width; this.vx = 0;
                    return 'left';
                } else if (min === oR && this.vx < 0) {
                    this.x = or2.right; this.vx = 0;
                    return 'right';
                }
                return 'general';
            }

            loseLife() {
                if (gameTime > invincibilityEnd) {
                    lives--;
                    invincibilityEnd = gameTime + 120; // ~2 seconds at 60fps
                    playSound('hurt');
                    if (lives <= 0) {
                        gameState = 'GAME_OVER';
                    } else {
                        this.x = 100; this.y = canvas.height - 300;
                        this.vx = 0; this.vy = 0;
                    }
                }
            }

            getRect() { return makeRect(this.x, this.y, this.width, this.height); }

            draw(ctx) {
                ctx.save();
                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2;
                ctx.translate(cx, cy);

                if (this.isJumping) ctx.rotate(this.jumpRotation);
                if (this.direction === -1) ctx.scale(-1, 1);

                // Invincibility blink
                if (gameTime < invincibilityEnd && Math.floor(gameTime / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.4;
                }

                const legKick = Math.sin(this.runFrame) * 5;

                // === HEAD with portrait ===
                if (portraitLoaded) {
                    const headR = 16;
                    const headY = -16;

                    // Gold ring
                    ctx.strokeStyle = '#FFD700';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, headY, headR + 2, 0, Math.PI * 2);
                    ctx.stroke();

                    // Circular clip for face
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(0, headY, headR, 0, Math.PI * 2);
                    ctx.clip();
                    ctx.drawImage(portraitImg, -headR, headY - headR, headR * 2, headR * 2);
                    ctx.restore();

                    // Blue beanie on top
                    ctx.fillStyle = '#3366FF';
                    ctx.beginPath();
                    ctx.ellipse(0, headY - headR + 4, headR + 2, 7, 0, Math.PI, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(-headR - 2, headY - headR + 4, (headR + 2) * 2, 3);
                } else {
                    // Fallback drawn head
                    ctx.fillStyle = '#3366FF';
                    ctx.beginPath();
                    ctx.ellipse(0, -20, 14, 10, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#8B6914';
                    ctx.fillRect(-12, -16, 24, 18);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-5, -10, 3, 3);
                    ctx.fillRect(2, -10, 3, 3);
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(0, -4, 5, 0, Math.PI);
                    ctx.fill();
                }

                // === HOODIE (red) ===
                ctx.fillStyle = '#E53333';
                ctx.beginPath();
                ctx.moveTo(-16, 0);
                ctx.lineTo(-16, 10);
                ctx.lineTo(-10, 16);
                ctx.lineTo(10, 16);
                ctx.lineTo(16, 10);
                ctx.lineTo(16, 0);
                ctx.lineTo(8, -4);
                ctx.lineTo(-8, -4);
                ctx.closePath();
                ctx.fill();

                // Hood outline
                ctx.strokeStyle = '#CC2222';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Hoodie pocket
                ctx.fillStyle = '#CC2222';
                ctx.fillRect(-8, 8, 16, 5);

                // === ARMS ===
                ctx.fillStyle = '#E53333';
                const armSwing = Math.sin(this.runFrame) * 6;
                ctx.fillRect(-19, 2 - armSwing, 5, 12);
                ctx.fillRect(14, 2 + armSwing, 5, 12);
                // Hands
                ctx.fillStyle = '#8B6914';
                ctx.fillRect(-19, 12 - armSwing, 5, 4);
                ctx.fillRect(14, 12 + armSwing, 5, 4);

                // === JEANS (blue) ===
                ctx.fillStyle = '#4466AA';
                ctx.fillRect(-8, 16, 7, 14 + legKick);
                ctx.fillRect(1, 16, 7, 14 - legKick);

                // === SHOES (yellow) ===
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(-10, 30 + legKick, 9, 4);
                ctx.fillRect(1, 30 - legKick, 9, 4);

                ctx.globalAlpha = 1;
                ctx.restore();
            }
        }

        // ===== PLATFORM =====
        class Platform {
            constructor(x, y, w, h, type = 'desk') {
                this.x = x; this.y = y;
                this.width = w; this.height = h;
                this.type = type;
            }
            getRect() { return makeRect(this.x, this.y, this.width, this.height); }
            draw(ctx) {
                if (this.type === 'desk') {
                    // Wooden desktop
                    const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.height);
                    grad.addColorStop(0, '#C8A45A');
                    grad.addColorStop(0.3, '#B8944A');
                    grad.addColorStop(1, '#A0803A');
                    ctx.fillStyle = grad;
                    ctx.fillRect(this.x, this.y, this.width, this.height * 0.6);
                    // Edge
                    ctx.fillStyle = '#8B6914';
                    ctx.fillRect(this.x, this.y + this.height * 0.5, this.width, 3);
                    // Legs
                    ctx.fillStyle = '#666';
                    ctx.fillRect(this.x + 6, this.y + this.height * 0.6, 4, this.height * 0.5);
                    ctx.fillRect(this.x + this.width - 10, this.y + this.height * 0.6, 4, this.height * 0.5);
                } else if (this.type === 'bookshelf') {
                    // Shelf frame
                    ctx.fillStyle = '#8B5E3C';
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    ctx.fillStyle = '#A0703C';
                    ctx.fillRect(this.x + 2, this.y + 2, this.width - 4, this.height - 4);
                    // Books on shelf
                    const colors = ['#E74C3C', '#3498DB', '#2ECC71', '#F39C12', '#9B59B6', '#1ABC9C'];
                    let bx = this.x + 4;
                    let i = 0;
                    while (bx < this.x + this.width - 8) {
                        const bw = 8 + Math.sin(i * 3.7) * 3;
                        ctx.fillStyle = colors[i % colors.length];
                        ctx.fillRect(bx, this.y + 4, bw, this.height - 8);
                        // Book spine line
                        ctx.fillStyle = 'rgba(0,0,0,0.2)';
                        ctx.fillRect(bx + bw/2 - 0.5, this.y + 6, 1, this.height - 12);
                        bx += bw + 2;
                        i++;
                    }
                } else if (this.type === 'floor') {
                    // Tiled floor
                    const grad = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.height);
                    grad.addColorStop(0, '#C4A96A');
                    grad.addColorStop(1, '#A08050');
                    ctx.fillStyle = grad;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                    // Tile pattern
                    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                    ctx.lineWidth = 1;
                    for (let tx = this.x; tx < this.x + this.width; tx += 40) {
                        ctx.beginPath();
                        ctx.moveTo(tx, this.y);
                        ctx.lineTo(tx, this.y + this.height);
                        ctx.stroke();
                    }
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y + this.height / 2);
                    ctx.lineTo(this.x + this.width, this.y + this.height / 2);
                    ctx.stroke();
                    // Top edge molding
                    ctx.fillStyle = '#8B6914';
                    ctx.fillRect(this.x, this.y, this.width, 4);
                }
            }
        }

        // ===== STAR (collectible) =====
        class Star {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.width = 24; this.height = 24;
                this.collected = false;
                this.rotation = 0;
                this.bobTime = Math.random() * Math.PI * 2;
                this.bobY = 0;
            }
            update() {
                this.rotation += 0.04;
                this.bobTime += 0.04;
                this.bobY = Math.sin(this.bobTime) * 4;
            }
            getRect() { return makeRect(this.x, this.y + this.bobY, this.width, this.height); }
            draw(ctx) {
                if (this.collected) return;
                ctx.save();
                const cx = this.x + this.width / 2;
                const cy = this.y + this.height / 2 + this.bobY;
                ctx.translate(cx, cy);
                ctx.rotate(this.rotation);
                // Glow
                ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
                ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
                // Star shape
                ctx.fillStyle = '#FFD700';
                ctx.strokeStyle = '#DAA520';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for (let i = 0; i < 10; i++) {
                    const r = i % 2 === 0 ? 10 : 5;
                    const a = (i * Math.PI) / 5 - Math.PI / 2;
                    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }
        }

        // ===== ENEMY: Revision Book =====
        class Enemy {
            constructor(x, y, type = 'book') {
                this.x = x; this.y = y;
                this.type = type;
                this.width = type === 'book' ? 30 : 24;
                this.height = type === 'book' ? 36 : 24;
                this.alive = true;
                this.minX = x - 120;
                this.maxX = x + 120;
                this.direction = -1;
                this.vx = 1.5;
                this.animation = 0;
                this.bookColor = ['#E74C3C', '#9B59B6', '#2ECC71', '#E67E22', '#3498DB'][Math.floor(Math.random() * 5)];
                this.bookTitle = ['MATHS', 'PHYS', 'HIST', 'FRAN', 'PHILO', 'INFO'][Math.floor(Math.random() * 6)];
            }
            update() {
                if (!this.alive) return;
                this.animation += 0.08;
                this.x += this.vx * this.direction;
                if (this.x < this.minX) this.direction = 1;
                if (this.x > this.maxX) this.direction = -1;
            }
            getRect() { return makeRect(this.x, this.y, this.width, this.height); }
            draw(ctx) {
                if (!this.alive) return;
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                // Slight wobble
                ctx.rotate(Math.sin(this.animation) * 0.15);

                if (this.type === 'book') {
                    // Walking revision book!
                    const hw = this.width / 2;
                    const hh = this.height / 2;

                    // Book body
                    ctx.fillStyle = this.bookColor;
                    ctx.fillRect(-hw, -hh, this.width, this.height - 8);
                    // Spine
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.fillRect(-hw, -hh, 4, this.height - 8);
                    // Pages (white edge)
                    ctx.fillStyle = '#FFF8E7';
                    ctx.fillRect(-hw + 4, -hh + 2, this.width - 6, 2);
                    ctx.fillRect(-hw + 4, hh - 12, this.width - 6, 2);
                    // Title
                    ctx.fillStyle = '#FFF';
                    ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(this.bookTitle, 2, -2);
                    // Angry eyes
                    ctx.fillStyle = '#FFF';
                    ctx.fillRect(-6, -hh + 8, 7, 6);
                    ctx.fillRect(2, -hh + 8, 7, 6);
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-4 + this.direction * 2, -hh + 10, 3, 3);
                    ctx.fillRect(4 + this.direction * 2, -hh + 10, 3, 3);
                    // Angry eyebrows
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(-7, -hh + 6);
                    ctx.lineTo(-1, -hh + 8);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(9, -hh + 6);
                    ctx.lineTo(3, -hh + 8);
                    ctx.stroke();
                    // Little legs
                    const legAnim = Math.sin(this.animation * 2) * 4;
                    ctx.fillStyle = this.bookColor;
                    ctx.fillRect(-8, hh - 10, 5, 8 + legAnim);
                    ctx.fillRect(4, hh - 10, 5, 8 - legAnim);
                    // Little shoes
                    ctx.fillStyle = '#333';
                    ctx.fillRect(-9, hh - 2 + legAnim, 7, 3);
                    ctx.fillRect(3, hh - 2 - legAnim, 7, 3);
                } else if (this.type === 'eraser') {
                    // Bouncing eraser
                    ctx.fillStyle = '#FFB6C1';
                    ctx.fillRect(-12, -8, 24, 16);
                    ctx.fillStyle = '#FF69B4';
                    ctx.fillRect(-12, -8, 6, 16);
                    // Angry face
                    ctx.fillStyle = '#000';
                    ctx.fillRect(-3, -3, 2, 3);
                    ctx.fillRect(4, -3, 2, 3);
                    ctx.beginPath();
                    ctx.arc(1, 4, 3, 0, Math.PI);
                    ctx.stroke();
                }

                ctx.restore();
            }
            die() {
                this.alive = false;
                playSound('stomp');
            }
        }

        // ===== FINISH FLAG =====
        class FinishFlag {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.width = 50; this.height = 100;
                this.waveTime = 0;
            }
            getRect() { return makeRect(this.x, this.y, this.width, this.height); }
            update() { this.waveTime += 0.05; }
            draw(ctx) {
                // Pole
                ctx.fillStyle = '#666';
                ctx.fillRect(this.x + 20, this.y, 6, this.height);
                // Ball on top
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(this.x + 23, this.y, 6, 0, Math.PI * 2);
                ctx.fill();
                // Flag with wave
                ctx.fillStyle = '#FF3333';
                ctx.beginPath();
                ctx.moveTo(this.x + 26, this.y + 5);
                ctx.lineTo(this.x + 50 + Math.sin(this.waveTime) * 5, this.y + 15);
                ctx.lineTo(this.x + 48 + Math.sin(this.waveTime + 1) * 3, this.y + 25);
                ctx.lineTo(this.x + 26, this.y + 30);
                ctx.closePath();
                ctx.fill();
                // FINISH text on flag
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 7px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('FIN!', this.x + 38, this.y + 20);
            }
        }

        function startGame() {
            gameState = 'PLAYING';
            score = 0; lives = 3;
            starsCollected = 0; enemiesDefeated = 0;
            cameraX = 0; invincibilityEnd = 0; gameTime = 0;
            player = new Player();
            player.y = getFloorY() - PLAYER_HEIGHT - 10;
            createLevel();
        }

        function resetGame() {
            gameState = 'START';
            score = 0; lives = 3;
        }

        // ===== BACKGROUND DRAWING =====
        function drawBackground() {
            // Sky gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
            skyGrad.addColorStop(0, '#87CEEB');
            skyGrad.addColorStop(1, '#B0E0F6');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height * 0.4);

            // Wall
            const wallGrad = ctx.createLinearGradient(0, canvas.height * 0.1, 0, canvas.height);
            wallGrad.addColorStop(0, '#F5E6D3');
            wallGrad.addColorStop(1, '#E8D5C0');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // === Windows (parallax) ===
            const parallax = cameraX * 0.3;
            for (let i = 0; i < 12; i++) {
                const wx = i * 500 - (parallax % 500);
                if (wx > -120 && wx < canvas.width + 120) {
                    // Window frame
                    ctx.fillStyle = '#8B7355';
                    ctx.fillRect(wx - 2, 60, 104, 104);
                    // Sky through window
                    ctx.fillStyle = '#87CEEB';
                    ctx.fillRect(wx, 62, 100, 100);
                    // Window cross
                    ctx.fillStyle = '#8B7355';
                    ctx.fillRect(wx + 48, 62, 4, 100);
                    ctx.fillRect(wx, 110, 100, 4);
                    // Curtains
                    ctx.fillStyle = '#DC143C';
                    ctx.fillRect(wx, 62, 12, 100);
                    ctx.fillRect(wx + 88, 62, 12, 100);
                    // Clouds through window
                    ctx.fillStyle = '#FFF';
                    const cloudX = (gameTime * 0.2 + i * 30) % 80;
                    ctx.beginPath();
                    ctx.arc(wx + cloudX, 90, 8, 0, Math.PI * 2);
                    ctx.arc(wx + cloudX + 10, 87, 10, 0, Math.PI * 2);
                    ctx.arc(wx + cloudX + 20, 90, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // === Chalkboard (fixed position, only visible when in range) ===
            const cbX = 1500 - cameraX;
            if (cbX > -300 && cbX < canvas.width + 50) {
                // Frame
                ctx.fillStyle = '#5C3A1E';
                ctx.fillRect(cbX - 5, 40, 260, 160);
                // Board
                ctx.fillStyle = '#2D5016';
                ctx.fillRect(cbX, 45, 250, 150);
                // Chalk tray
                ctx.fillStyle = '#5C3A1E';
                ctx.fillRect(cbX + 20, 195, 210, 8);
                // Chalk text
                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = '14px JetBrains Mono';
                ctx.textAlign = 'left';
                ctx.fillText('E = mc²', cbX + 20, 85);
                ctx.fillText('print("Hello!")', cbX + 20, 115);
                ctx.fillText('∫ f(x) dx', cbX + 20, 145);
                ctx.fillText('→ HERMAN ←', cbX + 20, 175);
            }

            // === Bulletin board ===
            const bbX = 700 - cameraX;
            if (bbX > -150 && bbX < canvas.width + 50) {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(bbX, 70, 130, 110);
                ctx.fillStyle = '#D2A060';
                ctx.fillRect(bbX + 3, 73, 124, 104);
                const noteColors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#95E1D3', '#DDA0DD', '#87CEEB'];
                for (let i = 0; i < 6; i++) {
                    ctx.fillStyle = noteColors[i];
                    const nx = bbX + 10 + (i % 3) * 40;
                    const ny = 82 + Math.floor(i / 3) * 45;
                    ctx.save();
                    ctx.translate(nx + 15, ny + 15);
                    ctx.rotate((Math.random() - 0.5) * 0.2);
                    ctx.fillRect(-15, -15, 32, 28);
                    ctx.restore();
                    // Pin
                    ctx.fillStyle = '#FF0000';
                    ctx.beginPath();
                    ctx.arc(nx + 15, ny, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // === Clock ===
            const clkX = 350 - cameraX;
            if (clkX > -30 && clkX < canvas.width + 30) {
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(clkX, 70, 22, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();
                // Numbers
                ctx.fillStyle = '#333';
                ctx.font = '8px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('12', clkX, 56);
                ctx.fillText('3', clkX + 14, 73);
                ctx.fillText('6', clkX, 88);
                ctx.fillText('9', clkX - 14, 73);
                // Hands (animated)
                const angle1 = (gameTime * 0.01) % (Math.PI * 2);
                const angle2 = (gameTime * 0.001) % (Math.PI * 2);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(clkX, 70);
                ctx.lineTo(clkX + Math.sin(angle2) * 10, 70 - Math.cos(angle2) * 10);
                ctx.stroke();
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(clkX, 70);
                ctx.lineTo(clkX + Math.sin(angle1) * 14, 70 - Math.cos(angle1) * 14);
                ctx.stroke();
                // Center dot
                ctx.fillStyle = '#E74C3C';
                ctx.beginPath();
                ctx.arc(clkX, 70, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // === Wainscoting / lower wall detail ===
            const fy = getFloorY();
            ctx.fillStyle = '#D4B896';
            ctx.fillRect(0, fy - 50, canvas.width, 50);
            ctx.fillStyle = '#C4A886';
            ctx.fillRect(0, fy - 50, canvas.width, 3);
        }

        // ===== HUD =====
        function drawHUD() {
            // Semi-transparent bar
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, 50);

            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 22px JetBrains Mono';
            ctx.textAlign = 'left';
            ctx.fillText('SCORE: ' + score, 20, 35);

            // Stars counter
            ctx.fillStyle = '#FFF';
            ctx.font = '18px JetBrains Mono';
            ctx.textAlign = 'center';
            ctx.fillText('⭐ ' + starsCollected, canvas.width / 2, 35);

            // Lives as hearts
            ctx.textAlign = 'right';
            ctx.fillStyle = '#FF3333';
            ctx.font = '22px Arial';
            let hearts = '';
            for (let i = 0; i < lives; i++) hearts += '❤️ ';
            ctx.fillText(hearts, canvas.width - 20, 35);
        }

        // ===== SCREENS =====
        function drawStartScreen() {
            // Background classroom feel
            ctx.fillStyle = '#F5E6D3';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Chalkboard-style title area
            ctx.fillStyle = '#2D5016';
            ctx.fillRect(canvas.width / 2 - 350, 40, 700, 300);
            ctx.strokeStyle = '#5C3A1E';
            ctx.lineWidth = 8;
            ctx.strokeRect(canvas.width / 2 - 354, 36, 708, 308);

            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 60px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('HERMAN', canvas.width / 2, 120);
            ctx.fillText('RUNNER', canvas.width / 2, 185);

            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 24px Orbitron';
            ctx.fillText('The Classroom Adventure', canvas.width / 2, 230);

            ctx.fillStyle = 'rgba(255,255,255,0.8)';
            ctx.font = '16px JetBrains Mono';
            ctx.fillText('← → ou A D pour bouger', canvas.width / 2, 280);
            ctx.fillText('ESPACE pour sauter (BACKFLIP!)', canvas.width / 2, 310);

            // Instructions below board
            ctx.fillStyle = '#333';
            ctx.font = '18px JetBrains Mono';
            ctx.fillText('Collecte les ⭐ et evite les livres de revision!', canvas.width / 2, 400);
            ctx.fillText('Saute sur les livres pour les eliminer!', canvas.width / 2, 430);

            ctx.fillStyle = '#2ECC71';
            ctx.font = 'bold 28px Orbitron';
            const blink = Math.sin(gameTime * 0.05) > 0;
            if (blink) ctx.fillText('APPUIE SUR ESPACE', canvas.width / 2, 510);

            // Draw player preview
            if (!player) player = new Player();
            player.x = canvas.width / 2 - PLAYER_WIDTH / 2;
            player.y = 550 + Math.sin(gameTime * 0.05) * 5;
            player.direction = 1;
            player.runFrame = gameTime * 0.05;
            player.draw(ctx);
        }

        function drawGameOverScreen() {
            ctx.fillStyle = 'rgba(0,0,0,0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FF3333';
            ctx.font = 'bold 70px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER!', canvas.width / 2, 150);

            ctx.fillStyle = '#FFD700';
            ctx.font = '36px JetBrains Mono';
            ctx.fillText('Score: ' + score, canvas.width / 2, 230);
            ctx.fillStyle = '#FFF';
            ctx.font = '22px JetBrains Mono';
            ctx.fillText('Etoiles: ' + starsCollected + '  |  Livres vaincus: ' + enemiesDefeated, canvas.width / 2, 290);

            ctx.fillStyle = '#2ECC71';
            ctx.font = 'bold 26px Orbitron';
            ctx.fillText('ESPACE POUR REJOUER', canvas.width / 2, 400);
        }

        function drawWinScreen() {
            ctx.fillStyle = 'rgba(0,0,0,0.88)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Confetti
            for (let i = 0; i < 80; i++) {
                const x = (Math.sin(gameTime * 0.03 + i * 1.7) * 0.5 + 0.5) * canvas.width;
                const y = ((gameTime * 1.5 + i * 13) % (canvas.height + 20)) - 10;
                const colors = ['#FFD700', '#FF3333', '#3366FF', '#FF69B4', '#2ECC71', '#9B59B6'];
                ctx.fillStyle = colors[i % colors.length];
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(gameTime * 0.02 + i);
                ctx.fillRect(-4, -2, 8, 4);
                ctx.restore();
            }

            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 55px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('BRAVO HERMAN!', canvas.width / 2, 100);

            ctx.fillStyle = '#2ECC71';
            ctx.font = '34px Orbitron';
            ctx.fillText("T'as survecu aux revisions!", canvas.width / 2, 170);

            ctx.fillStyle = '#FFF';
            ctx.font = '24px JetBrains Mono';
            ctx.fillText('Score final: ' + score, canvas.width / 2, 250);
            ctx.fillText('Etoiles: ' + starsCollected + ' / 15', canvas.width / 2, 290);
            ctx.fillText('Livres vaincus: ' + enemiesDefeated, canvas.width / 2, 330);

            // Draw player celebrating
            if (player) {
                player.x = canvas.width / 2 - PLAYER_WIDTH / 2;
                player.y = 380;
                player.direction = 1;
                player.isJumping = true;
                player.jumpRotation = (gameTime * 0.1) % (Math.PI * 2);
                player.runFrame = 0;
                player.draw(ctx);
            }

            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 24px Orbitron';
            const blink = Math.sin(gameTime * 0.05) > 0;
            if (blink) ctx.fillText('ESPACE POUR REJOUER', canvas.width / 2, 490);
        }

        // ===== MAIN LOOP =====
        function gameLoop() {
            gameTime++;

            if (gameState === 'START') {
                drawStartScreen();
            } else if (gameState === 'PLAYING') {
                player.update();
                cameraX = Math.max(0, Math.min(player.x - canvas.width / 3, LEVEL_WIDTH - canvas.width));

                // Collisions
                for (let p of platforms) player.collideWith(p);

                for (let s of stars) {
                    s.update();
                    if (!s.collected && player.getRect().intersect(s.getRect())) {
                        s.collected = true;
                        score += 100;
                        starsCollected++;
                        playSound('collect');
                    }
                }

                for (let e of enemies) {
                    e.update();
                    if (e.alive) {
                        const pr = player.getRect();
                        const er = e.getRect();
                        if (pr.intersect(er)) {
                            // Check if stomping from above
                            if (player.vy > 0 && player.y + player.height - 8 < e.y + 5) {
                                player.vy = -10;
                                e.die();
                                score += 200;
                                enemiesDefeated++;
                            } else if (gameTime > invincibilityEnd) {
                                player.loseLife();
                            }
                        }
                    }
                }

                finishFlag.update();
                if (player.getRect().intersect(finishFlag.getRect())) {
                    gameState = 'WIN';
                    playSound('win');
                }

                // Draw everything
                drawBackground();

                ctx.save();
                ctx.translate(-cameraX, 0);
                for (let p of platforms) p.draw(ctx);
                for (let s of stars) s.draw(ctx);
                for (let e of enemies) e.draw(ctx);
                finishFlag.draw(ctx);
                player.draw(ctx);
                ctx.restore();

                drawHUD();
            } else if (gameState === 'GAME_OVER') {
                drawGameOverScreen();
            } else if (gameState === 'WIN') {
                drawWinScreen();
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
